plugins {
    alias libs.plugins.android.application
}

// 固定签名 keystore：CI 用 KEYSTORE_PATH 环境变量（从 Secrets 还原），本地放 app/keystore.jks
def keyFile = file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
def keyFileExists = keyFile.exists()

android {
    namespace = 'com.spider.check'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.spider.check"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 8
        versionName "1.0.8"
    }

    signingConfigs {
        debug {
            // 兜底：CI 未提供固定 keystore 时才用（签名会每次变化，不推荐）
        }
        release {
            // 固定签名：CI 从 GitHub Secrets 还原 keystore（KEYSTORE_PATH 指向它），
            // 本地也可放 app/keystore.jks。保证每次构建签名一致，升级无需卸载。
            if (keyFileExists) {
                storeFile keyFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // 有固定 keystore 用它，否则退回 debug 签名
            signingConfig = keyFileExists ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation project(':catvod')
    implementation project(':chaquo')
    implementation project(':quickjs')
    implementation libs.material
    implementation libs.recyclerview
    implementation libs.appcompat
    coreLibraryDesugaring libs.desugar
}
